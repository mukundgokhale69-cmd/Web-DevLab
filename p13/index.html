    <h2>Flexbox Layout</h2>

    <div class="flex-container">

        <div class="card1">
            <h3>HTML</h3>
            <p>Used for webpage structure.</p>

        <div class="card2">

        </div>

    </div>

    <div class="grid-container">

        <div class="card4">
            <h3>HTML</h3>

            <p>Used for webpage styling.</p>

        <div class="card6">

            <p>Used for webpage interaction.</p>

</body>
</html>
